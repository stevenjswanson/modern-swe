# Everything in the page header and footer. Edited rarely.
# For the week-to-week schedule, edit _data/talks.json instead.

# Theme: classic | mono | vibrant   (see assets/css/themes.css)
theme: classic

# Set false to hide the schedule entirely until speakers are confirmed.
show_schedule: true

# Speakers marked "tentative": true in talks.json are NOT shown publicly while
# this is false -- their rows render as "Speaker to be announced". Flip to true
# to show them all with a "Tentative" chip, or set a single speaker's
# "tentative": false in talks.json to publish just that one.
show_tentative: false

eyebrow: "Fall 2026 · CSE 090-SE / CSE 290-SE · 1 Unit"
title: "Tales of Modern Software Engineering"
tagline: "How AI is (and isn't) changing how software engineers build the computer systems that power our world"

# Body copy under the tagline. A list, so paragraphs can be added or
# reordered without touching any template.
description:
  - "Each week, practicing software engineers and system builders will share their experience and answer your questions about building software in the age of generative AI."
  - "If you register for credit (Pass/No Pass only), you will need to attend 70% of the days to pass the course. Roll will be taken."

# Talk-notification sign-up (/notifications/). Both values are required before
# the page can do anything; until they are filled in it says so plainly.
#   client_id — OAuth 2.0 Web client ID from Google Cloud, with
#               https://stevenjswanson.github.io as an authorized JavaScript origin.
#   endpoint  — the Apps Script deployment that accepts the signed token. This must
#               be the deployment whose access is "Anyone", NOT the domain-only one
#               the question board uses.
notifications:
  # Remove label to drop the button from the home page.
  label: "Get Talk Notifications"
  who: "for everyone"
  client_id: "41803804612-idi3j5k4b7m778mf06ef7f2i7npdvnhb.apps.googleusercontent.com"
  endpoint: "https://script.google.com/macros/s/AKfycbwbD6w39toxeHkwalzR13bPREla4IOJuf3DgT6ne789o5LMq4gpVzz2Umi50sw5d94i/exec"

