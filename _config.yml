title: "Tales of Modern Software Engineering"
description: "CSE 090-SE / CSE 290-SE — How AI is (and isn't) changing how software engineers build the computer systems that power our world. UC San Diego, Fall 2026."
url: "https://stevenjswanson.github.io"
baseurl: "/modern-swe"

# Jekyll reads _data/*.json and _data/*.yml automatically:
#   _data/talks.json  -> site.data.talks.talks
#   _data/course.yml  -> site.data.course

exclude:
  - Gemfile
  - Gemfile.lock
  - bin
  - README.md
  - vendor
  - .github
  - .gitignore
  - _outreach

# No plugins required. Adding one later means adding it here AND to the Gemfile.
plugins: []
